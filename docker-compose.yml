version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    environment:
      - PORT=3000
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-}
      - DEBUG=${DEBUG:-True}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - DB_HOST=${DB_HOST:-postgres.railway.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-railway}
      - DB_SSLMODE=${DB_SSLMODE:-prefer}
      - API_KEY=${API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - TZ=Asia/Tashkent
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - API_URL=${API_URL:-http://backend:3000}
      - API_KEY=${API_KEY:-}
      - APP_URL=${APP_URL:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - TZ=Asia/Tashkent
    depends_on:
      - backend
    restart: unless-stopped

  timetable:
    build:
      context: ./timetable
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - EDUPAGE_URL=${EDUPAGE_URL:-https://iut.edupage.org}
      - CAPTURE_SCREENSHOTS=${CAPTURE_SCREENSHOTS:-true}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
      - S3_REGION=${S3_REGION:-auto}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - TZ=Asia/Tashkent
    profiles:
      - tools

  notifier:
    build:
      context: ./notifier
      dockerfile: Dockerfile
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - API_URL=${API_URL:-http://backend:3000}
      - API_KEY=${API_KEY:-}
      - TZ=Asia/Tashkent
    depends_on:
      - backend
    restart: unless-stopped

  payment-worker:
    build:
      context: ./payment_worker
      dockerfile: Dockerfile
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELETHON_SESSION_STRING=${TELETHON_SESSION_STRING:-}
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:3000}
      - PAYMENT_SECRET_KEY=${PAYMENT_SECRET_KEY:-}
      - ALLOWED_SMS_SENDERS=${ALLOWED_SMS_SENDERS:-humocardbot}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ADMIN_TELEGRAM_ID=${ADMIN_TELEGRAM_ID:-}
      - TZ=Asia/Tashkent
    depends_on:
      - backend
    restart: unless-stopped

